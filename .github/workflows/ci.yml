name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Core tests
        run: swift test
      - name: Build app
        run: ./build.sh
      - name: Validate bundle
        run: |
          codesign --verify --deep --strict "dist/AI Quota.app"
          test -s "dist/AI Quota.app/Contents/Resources/AppIcon.icns"
          test -d "dist/AI Quota.app/Contents/Resources/AIQuota_QuotaCore.bundle"
          plutil -lint "dist/AI Quota.app/Contents/Info.plist"
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        env:
          VERSION: 8.30.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 3 -O "$base/$archive"
          curl --fail --location --retry 3 -O "$base/gitleaks_${VERSION}_checksums.txt"
          grep " $archive\$" "gitleaks_${VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan history and working files (redacted)
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts="--all" .
          "$RUNNER_TEMP/gitleaks" dir --redact .
